name: FocusGuard checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:extension
      - run: npm run check:extension
      - run: npm run lint:product
      - run: npm run build
      - run: npm run package:extension
      - uses: actions/upload-artifact@v4
        with:
          name: focusguard-extension
          path: public/focusguard-extension.zip
